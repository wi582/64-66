{% extends "base.html" %}
{% block title %}Entrance — Claude Monet{% endblock %}
{% block content %}
<main class="entrance">
  <div class="panel">
    <header><a href="{{ url_for('home') }}" aria-label="Back">←</a><h1>Entrance</h1></header>
    <label class="field"><input type="text" name="login" placeholder="login" autocomplete="username"></label>
    <label class="field"><input type="password" id="pw" name="password" placeholder="password" autocomplete="current-password">
      <button type="button" id="toggle" aria-label="Show password">👁</button></label>
    <p class="links"><a href="#"><b>Registration</b></a> <a href="#">Forgot your password?</a></p>
  </div>
</main>
<script>
document.getElementById('toggle').addEventListener('click', function () {
  var pw = document.getElementById('pw');
  pw.type = pw.type === 'password' ? 'text' : 'password';
});
</script>
{% endblock %}
